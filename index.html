<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>VALORANT</title>
    <style>
        body {
            margin: 0; background-color: #050b14; color: white;
            font-family: 'Arial', sans-serif; overflow: hidden;
            width: 100vw; height: 100vh; user-select: none;
        }

        #gameCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; cursor: crosshair; z-index: 1;
        }

        /* --- 발로란트 상단 HUD --- */
        #top-hud {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 900px; display: flex; justify-content: space-between;
            align-items: flex-start; z-index: 10; pointer-events: none; padding-top: 10px;
        }
        .team-score { background: rgba(15, 25, 35, 0.8); border: 1px solid #3d4f5f; padding: 4px 15px; font-weight: bold; font-size: 14px; border-radius: 2px; }
        .center-timer { background: rgba(15, 25, 35, 0.9); border: 1px solid #ff4655; padding: 6px 20px; font-weight: bold; font-size: 16px; border-radius: 4px; display: flex; align-items: center; gap: 10px; }
        .agent-icons { display: flex; gap: 4px; }
        .agent-icon { width: 22px; height: 22px; background: #3d4f5f; border-radius: 50%; border: 1px solid #fff; }

        /* --- 오퍼레이터 스코프 테두리 오버레이 --- */
        #scope-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5; display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.95);
            border: 45px solid rgba(20, 25, 35, 0.95);
        }
        #scope-overlay::after {
            content: ''; position: absolute; width: 2px; height: 100%; background: rgba(0, 255, 204, 0.3);
        }
        #scope-overlay::before {
            content: ''; position: absolute; width: 100%; height: 2px; background: rgba(0, 255, 204, 0.3);
        }

        /* --- 발로란트 하단 HUD --- */
        #bottom-hud {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 10; pointer-events: none; align-items: center;
        }
        .hud-panel {
            background: rgba(15, 25, 35, 0.85); border: 1px solid #3d4f5f;
            padding: 8px 18px; font-weight: bold; font-size: 14px; border-radius: 4px;
            display: flex; align-items: center; gap: 8px;
        }
        .skill-box {
            width: 30px; height: 30px; background: #222; border: 1px solid #555;
            display: flex; justify-content: center; align-items: center; font-size: 11px; color: #aaa; border-radius: 3px;
        }

        /* 상점 UI */
        #shopModal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: #1f2a36;
            border: 2px solid #ff4655; padding: 20px; border-radius: 8px;
            z-index: 20; width: 420px; pointer-events: auto;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 상단 인게임 스코어 & 타이머 -->
    <div id="top-hud">
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="team-score" style="color: #00ffcc;">ATTACK <span id="atkScore">0</span></div>
            <div class="agent-icons"><div class="agent-icon"></div><div class="agent-icon"></div><div class="agent-icon"></div></div>
        </div>
        <div class="center-timer">
            <span style="color: #ff4655;">●</span> <span id="timer">1:37</span>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="agent-icons"><div class="agent-icon"></div><div class="agent-icon"></div><div class="agent-icon"></div></div>
            <div class="team-score" style="color: #ff4655;">DEFENSE <span id="defScore">0</span></div>
        </div>
    </div>

    <!-- 오퍼레이터 스코프 시각 효과 -->
    <div id="scope-overlay"></div>

    <!-- 3D 캔버스 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 하단 발로란트 HUD (체력, 스킬, 장비, 탄창) -->
    <div id="bottom-hud">
        <div class="hud-panel">
            <span style="color: #888; font-size: 11px;">HP</span>
            <span style="color: #00ffcc; font-size: 18px;" id="hp">100</span>
        </div>
        <div class="hud-panel" style="gap: 5px;">
            <div class="skill-box">C</div>
            <div class="skill-box">Q</div>
            <div class="skill-box">E</div>
            <div class="skill-box">X</div>
        </div>
        <div class="hud-panel">
            <span style="color: #ffcc00;" id="weaponName">오퍼레이터</span>
        </div>
        <div class="hud-panel" style="font-size: 18px;">
            <span style="color: white;" id="ammo">5</span> <span style="color: #666; font-size: 12px;">/ 5</span>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let keys = { w: false, s: false, a: false, d: false };
        let hp = 100, score = 0, ammo = 5;
        let targets = [];
        let raycaster = new THREE.Raycaster();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1017);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000); // 저격총 줌 느낌의 시야각(FOV 40)
            camera.position.set(0, 1.6, 5);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gameCanvas"), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            // 조명
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // 맵 배경 (연습장 풍경)
            const floorGeo = new THREE.PlaneGeometry(60, 60);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x151d28 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // 복도 벽 구조물
            createWall(-4, 2.5, -10, 1, 5, 30, 0x222d3b);
            createWall(4, 2.5, -10, 1, 5, 30, 0x222d3b);

            // 적 봇 생성 (스코프 중앙에 보이도록 배치)
            spawnBot();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));
            
            window.addEventListener('click', () => {
                document.body.requestPointerLock();
                shoot();
            });

            window.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    camera.rotation.y -= e.movementX * 0.0015;
                    let pitch = camera.rotation.x - e.movementY * 0.0015;
                    camera.rotation.x = Math.max(-Math.PI/3, Math.min(Math.PI/3, pitch));
                }
            });
        }

        function createWall(x, y, z, w, h, d, color) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: color }));
            wall.position.set(x, y, z);
            scene.add(wall);
        }

        function spawnBot() {
            const botMesh = new THREE.Mesh(
                new THREE.CapsuleGeometry(0.4, 1.2, 4, 8),
                new THREE.MeshStandardMaterial({ color: 0xff4655 })
            );
            botMesh.position.set((Math.random() - 0.5) * 4, 1, -12 - Math.random() * 5);
            scene.add(botMesh);
            targets.push(botMesh);
        }

        function handleKey(e, isDown) {
            if (e.key === 'w' || e.key === 'W') keys.w = isDown;
            if (e.key === 's' || e.key === 'S') keys.s = isDown;
            if (e.key === 'a' || e.key === 'A') keys.a = isDown;
            if (e.key === 'd' || e.key === 'D') keys.d = isDown;
            if (e.key === 'r' || e.key === 'R') {
                ammo = 5;
                document.getElementById('ammo').innerText = ammo;
            }
        }

        function shoot() {
            if (ammo <= 0) return;
            ammo--;
            document.getElementById('ammo').innerText = ammo;

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(targets);

            if (intersects.length > 0) {
                const hit = intersects[0].object;
                scene.remove(hit);
                targets = targets.filter(t => t !== hit);
                score++;
                document.getElementById('atkScore').innerText = score;

                setTimeout(spawnBot, 1000);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const speed = 0.08;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0; dir.normalize();
            const sideDir = new THREE.Vector3(-dir.z, 0, dir.x);

            if (keys.w) camera.position.addScaledVector(dir, speed);
            if (keys.s) camera.position.addScaledVector(dir, -speed);
            if (keys.a) camera.position.addScaledVector(sideDir, speed);
            if (keys.d) camera.position.addScaledVector(sideDir, -speed);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
